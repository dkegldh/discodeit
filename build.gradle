plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.sprint.mission'
version = '3.0-M12'
description = 'Demo project for Spring Boot'
sourceCompatibility = '17'
targetCompatibility = '17'

java {
    toolchain {
        // languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Boot 3.4.3이 관리하는 Testcontainers 1.20.x는 Docker Engine 29(최소 API 1.44)와 통신하지 못함
ext['testcontainers.version'] = '1.21.4'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'software.amazon.awssdk:s3:2.31.7'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.3'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.security:spring-security-messaging'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 일반 jar 생성 방지 (아까 했던 것)
jar {
    enabled = false
}

// 실행 가능한 jar 생성 및 이름 고정 (가장 중요)
bootJar {
    archiveFileName = 'app.jar'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport

    // CI 로그에서 건너뛴 테스트(예: Docker가 없어 skip된 Testcontainers 테스트)를 확인할 수 있도록 출력
    testLogging {
        events 'skipped', 'failed'
        exceptionFormat 'full'
    }
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "Tests: ${result.testCount}, passed: ${result.successfulTestCount}, " +
                "failed: ${result.failedTestCount}, skipped: ${result.skippedTestCount}"
        }
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}