spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;Mode=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
      platform: h2
  # 테스트는 외부 인프라(Redis) 없이 실행되도록 인메모리 캐시 사용
  cache:
    type: simple
  # 테스트에서는 Kafka 브로커 없이 실행되도록 컨슈머를 시작하지 않음 (프로듀서는 MockitoBean으로 대체)
  kafka:
    listener:
      auto-startup: false

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: debug
    org.springframework.test: info
    com.sprint.mission.discodeit: debug

discodeit:
  repository:
    type: jpa
  storage:
    type: test